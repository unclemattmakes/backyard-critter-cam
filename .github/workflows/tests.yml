name: tests

on: [push, pull_request]

# This workflow only reads the checkout and runs pytest -- it never writes to the repo, and it
# handles no secrets. Say so, because the default GITHUB_TOKEN permissions are repo-wide and a
# `pull_request` build runs code from whoever opened the PR. An unpinned dependency that decided
# to shell out would find a token that can only read.
permissions:
  contents: read

jobs:
  pytest:
    # Branch protection requires the ubuntu check by this exact name -- don't change its string.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # A Windows failure must not cancel the required ubuntu check (and vice versa).
      fail-fast: false
      matrix:
        include:
          # 3.12 is the floor job: pyproject's floor is 3.10, and 3.12 is the version every
          # dependency here has had prebuilt wheels for the longest.
          - name: pytest (ubuntu, CPU-only)
            os: ubuntu-latest
            python: "3.12"
          # The rig's real platform: Windows + Python 3.14. Every requirement (CPU torch
          # included) has win_amd64 cp314 wheels, so nothing builds from source here.
          - name: pytest (windows, Python 3.14, CPU-only)
            os: windows-latest
            python: "3.14"
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt deliberately omits torch (setup.sh / setup.bat pick a build per
          # machine). This runner has no GPU, so take the CPU wheels -- ~250MB instead of ~3GB.
          # tests/test_clipfilter.py importorskips torch, so omitting this would silently skip a
          # test file rather than fail -- install it so CI actually covers the non-animal gate.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # A GitHub ubuntu runner has no libGL.so.1, so `import cv2` from the normal opencv-python
      # wheel dies at collection (four test modules import it). Swap in the headless build AFTER
      # requirements, because ultralytics' metadata requires opencv-python and pulls it back.
      # Nothing in the suite imports ultralytics, so the dangling requirement is harmless.
      # Windows ships the GUI libraries, so it keeps the same opencv-python the rig runs.
      - name: Swap in headless OpenCV (Linux)
        if: runner.os == 'Linux'
        run: |
          pip uninstall -y opencv-python
          pip install "opencv-python-headless>=4.10,<5"

      - name: Run the test suite
        run: python -m pytest tests/ -q

      # Lint after the tests (and even if they failed) so one red step doesn't hide the other.
      # Pinned so a new ruff release can't turn the build red on its own; config is in pyproject.
      # Once is enough -- the result doesn't depend on the OS.
      - name: Lint (ruff)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          pip install "ruff==0.16.9"
          ruff check .
